name: Temporary PWA production route audit
on:
  push:
    branches: [format-preview-20261030]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify actual Hestia/Nginx public routes
        shell: bash
        run: |
          set -uo pipefail
          host=https://clan.dungeon-rush.webestit.com
          for attempt in $(seq 1 55); do
            echo "Production check #$attempt"
            passed=1
            for route in assets/clan-emblem.png assets/manifest.json assets/icon-192.png assets/icon-512.png assets/icon-maskable-512.png assets/apple-touch-icon.png assets/sw.js api/pwa/worker; do
              status=$(curl --silent --show-error --location --max-time 12 --dump-header "/tmp/pwa-headers" --output "/tmp/pwa-body" --write-out '%{http_code}' "$host/$route") || status=error
              type=$(grep -i '^content-type:' /tmp/pwa-headers | tail -1 | tr -d '\r' || true)
              scope=$(grep -i '^service-worker-allowed:' /tmp/pwa-headers | tail -1 | tr -d '\r' || true)
              echo "  $route HTTP $status $type $scope"
              if [ "$status" != 200 ]; then passed=0; continue; fi
              if [ "$route" = "api/pwa/worker" ]; then
                echo "$type" | grep -qi 'javascript' || passed=0
                echo "$scope" | grep -q '/$' || passed=0
                grep -q 'clan-static-' /tmp/pwa-body || passed=0
              fi
              if [ "$route" = "assets/manifest.json" ]; then
                node -e "let fs=require('fs'),m=JSON.parse(fs.readFileSync('/tmp/pwa-body','utf8')); if(m.scope!=='/'||!m.icons.some(i=>i.sizes==='192x192')||!m.icons.some(i=>i.sizes==='512x512'))process.exit(1)" || passed=0
              fi
            done
            root=$(curl --silent --show-error --max-time 12 "$host/" || true)
            if ! grep -q '/assets/manifest.json' <<< "$root"; then
              echo '  Root HTML still references the old manifest'
              passed=0
            fi
            if [ "$passed" -eq 1 ]; then echo 'PWA public endpoints all reachable'; exit 0; fi
            sleep 10
          done
          echo 'PWA endpoints did not become available' >&2
          exit 1
