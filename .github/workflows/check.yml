name: Check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      - run: node scripts/ci-contract-check.mjs
      - run: node scripts/locale-check.mjs
      - run: node scripts/image-crop-check.mjs
      - run: node scripts/roster-match-check.mjs
      - run: node scripts/image-prep-check.mjs
      - run: npm run wiki:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/migrate-check.mjs
      - name: Production server smoke test
        run: |
          export NODE_ENV=production
          export APP_ORIGIN=https://clan.example.com
          export BOOTSTRAP_TOKEN=$(openssl rand -hex 24)
          export DATA_DIR=$(mktemp -d)
          export PORT=3128
          npm start > /tmp/clan-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true; cat /tmp/clan-server.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3128/api/auth/setup-state | grep -q '"initialized":false'; then
              curl -fsS http://localhost:3128/ | grep -q 'Dungeon Rush'
              node scripts/smoke.mjs
              exit 0
            fi
            sleep 1
          done
          echo 'Server did not become ready'
          exit 1
