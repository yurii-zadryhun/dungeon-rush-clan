name: Agent format diagnostics (read-only)
on:
  push:
    paths:
      - '.github/workflows/agent-format-preview.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Emit Prettier-formatted sources to job logs
        shell: bash
        run: |
          npm run format
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const changed = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACM'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          console.log('FORMAT_FILES_COUNT:' + changed.length);
          for (const file of changed) {
            const serialized = JSON.stringify(fs.readFileSync(file, 'utf8'));
            console.log('FORMAT_START:' + file + ':' + serialized.length);
            for (let i = 0; i < serialized.length; i += 2000) {
              console.log('FORMAT_DATA:' + serialized.slice(i, i + 2000));
            }
            console.log('FORMAT_END:' + file);
          }
          NODE
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
